function obterDiaDoAno() {
    const hoje = new Date();
    const inicioDoAno = new Date(hoje.getFullYear(), 0, 0);
    const diff = hoje - inicioDoAno;
    const umDia = 1000 * 60 * 60 * 24;
    return Math.floor(diff / umDia);
}

function atualizarFraseDoDia() {
    const diaDoAno = obterDiaDoAno();

    document.getElementById("data").textContent = `Hoje é ${hoje.toLocaleDateString()}.`;
    document.getElementById("frase-do-dia").textContent = frase;
}
