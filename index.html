<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frase do Dia</title>

<style>

:root {
    --btn-largura: 160px;
}

/* Página */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-image: url('pordosol.jpg);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    color: #fff;
}

.container {
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    padding: 40px 30px;
    width: 90%;
    max-width: 700px;
    text-align: center;
}

h1 {
    font-size: 2.5rem;
    color: #ffd27a;
    margin-bottom: 20px;
    font-weight: 700;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
}

#data {
    font-size: 1.2rem;
    color: #f5f5f5;
    margin-bottom: 30px;
    font-style: italic;
}

#frase-do-dia {
    color: white;
    font-size: 1.6rem;
    text-shadow: 1px 1px 8px rgba(0,0,0,0.8);
}

/* Botão */
button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background-color: #4e73df;
    color: white;
    border: none;
    border-radius: 5px;
    width: var(--btn-largura);
}

/* TEXTO ACIMA DO QUADRADO */
.credito-texto {
    font-size: 0.75rem;
    font-weight: 700;
    color: #000;
    letter-spacing: 1px;
    text-align: center;
}
/* IMAGEM NO LUGAR DO QUADRADO */
.imagem-credito {
    width: var(--btn-largura);
    height: var(--btn-largura);
    margin-top: 10px;
    border-radius: 10px;
    object-fit: cover;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

/* RESPONSIVO */
@media (max-width: 480px) {
    h1 {
        font-size: 2rem;
    }
    #frase-do-dia {
        font-size: 1.2rem;
    }
}

</style>
</head>

<body>

<div class="container">
    <h1>Frase do Dia</h1>
    <p id="data"></p>
    <p><strong id="frase-do-dia"></strong></p>
    <button onclick="fecharPagina()">Fechar</button>
</div>

<!-- CRÉDITO + IMAGEM -->
<div class="credito-texto">CRIADO E PRODUZIDO POR:</div>

<img class="imagem-credito" src='logo.png alt="Crédito">

<script>
const frases = [
    "Eu sou capaz de alcançar tudo o que eu quero.",
    "Eu sou grato pelas pequenas coisas da vida.",
];

function obterDiaDoAno() {
    const hoje = new Date();
    const inicioDoAno = new Date(hoje.getFullYear(), 0, 0);
    const diff = hoje - inicioDoAno;
    const umDia = 1000 * 60 * 60 * 24;
    return Math.floor(diff / umDia);
}

function atualizarFraseDoDia() {
    const diaDoAno = obterDiaDoAno();
    const frase = frases[diaDoAno - 1] || "Frase não definida para este dia.";
    const hoje = new Date();

    document.getElementById("data").textContent = `Hoje é ${hoje.toLocaleDateString()}.`;
    document.getElementById("frase-do-dia").textContent = frase;
}

atualizarFraseDoDia();

function fecharPagina() {
    window.location.replace("about:blank");
    setTimeout(() => {
        window.close();
    }, 100);
}
</script>

</body>
</html>
